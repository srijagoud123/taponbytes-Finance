<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Application | TaponBytes Finance</title>

     <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7WRV8HERHE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-7WRV8HERHE');
</script>

    <style>
        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f3fb;
            color: #171717;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .loan-page {
            min-height: 100vh;
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 35px 20px;
        }


        /* =====================================================
           FORM CARD
        ===================================================== */

        .loan-card {
            width: 100%;
            max-width: 570px;

            background: #ffffff;

            padding: 30px 38px 35px;

            box-shadow:
                0 3px 18px rgba(0, 0, 0, 0.08);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .form-header {
            margin-bottom: 25px;
        }


        .form-header h1 {
            color: #18208f;

            font-size: 22px;
            font-weight: 700;

            line-height: 1.3;

            margin-bottom: 5px;
        }


        .form-header p {
            color: #777777;

            font-size: 12px;
        }


        /* =====================================================
           FORM GROUP
        ===================================================== */

        .form-group {
            width: 100%;
            margin-bottom: 18px;
        }


        /* =====================================================
           LABEL
        ===================================================== */

        .form-group label {
            display: block;

            color: #171717;

            font-size: 15px;
            font-weight: 600;

            line-height: 1.4;

            margin-bottom: 8px;
        }


        /* =====================================================
           INPUT + SELECT
        ===================================================== */

        .form-group input,
        .form-group select {
            width: 100%;
            height: 42px;

            padding: 0 13px;

            border: 1px solid #cbd0d2;
            border-radius: 0;

            background: #ffffff;

            color: #222222;

            font-family: inherit;
            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* =====================================================
           PLACEHOLDER
        ===================================================== */

        .form-group input::placeholder {
            color: #999999;
        }


        /* =====================================================
           FOCUS
        ===================================================== */

        .form-group input:focus,
        .form-group select:focus {
            border-color: #188f70;

            box-shadow:
                0 0 0 2px rgba(24, 143, 112, 0.08);
        }


        /* =====================================================
           SELECT
        ===================================================== */

        .form-group select {
            cursor: pointer;
        }


        /* =====================================================
           HELP TEXT
        ===================================================== */

        .help-text {
            display: block;

            margin-top: 5px;

            color: #888888;

            font-size: 11px;

            line-height: 1.4;
        }


        /* =====================================================
           SUBMIT BUTTON
        ===================================================== */

        .submit-button {
            width: 150px;
            height: 48px;

            margin-top: 4px;

            border: none;
            border-radius: 4px;

            background: #5425ed;
            color: #ffffff;

            font-family: inherit;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .submit-button:hover {
            background: #4018c9;

            transform: translateY(-1px);
        }


        .submit-button:active {
            transform: translateY(0);
        }


        /* =====================================================
           FORM NOTE
        ===================================================== */

        .form-note {
            margin-top: 17px;

            color: #888888;

            font-size: 10px;

            line-height: 1.6;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 991px) {

            .loan-page {
                padding: 30px 20px;
            }

            .loan-card {
                max-width: 620px;

                padding: 30px 35px 35px;
            }

            .form-header h1 {
                font-size: 21px;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 767px) {

            .loan-page {
                padding: 20px 14px;
            }

            .loan-card {
                max-width: 100%;

                padding: 25px 22px 30px;
            }

            .form-header {
                margin-bottom: 22px;
            }

            .form-header h1 {
                font-size: 19px;
            }

            .form-header p {
                font-size: 11px;
            }

            .form-group {
                margin-bottom: 16px;
            }

            .form-group label {
                font-size: 14px;

                margin-bottom: 7px;
            }

            .form-group input,
            .form-group select {
                height: 43px;

                font-size: 14px;

                padding: 0 12px;
            }

            .submit-button {
                width: 100%;

                height: 47px;

                font-size: 14px;
            }
        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 420px) {

            .loan-page {
                padding: 12px 9px;
            }

            .loan-card {
                padding: 22px 17px 27px;
            }

            .form-header h1 {
                font-size: 18px;
            }

            .form-group label {
                font-size: 13px;
            }

            .form-group input,
            .form-group select {
                height: 42px;

                font-size: 13px;
            }

            .help-text {
                font-size: 10px;
            }

            .form-note {
                font-size: 9px;
            }
        }
    </style>
</head>


<body>

    <main class="loan-page">

        <div class="loan-card">

            <!-- =========================
                 FORM HEADER
            ========================== -->

            <div class="form-header">

                <h1>LOAN APPLICATION FORM</h1>

                <p>
                    TaponBytes Finance
                </p>

            </div>


            <!-- =========================
                 FORMSPREE FORM
            ========================== -->

            <form
                action="https://formspree.io/f/xljrvavz"
                method="POST"
            >

                <!-- Email subject -->
                <input
                    type="hidden"
                    name="_subject"
                    value="New Loan Application - TaponBytes Finance"
                >


                <!-- =========================
                     FULL NAME
                ========================== -->

                <div class="form-group">

                    <label for="fullName">
                        Full name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="full_name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- =========================
                     DATE OF BIRTH
                ========================== -->

                <div class="form-group">

                    <label for="dob">
                        Date of birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                        name="date_of_birth"
                        required
                    >

                </div>


                <!-- =========================
                     OCCUPATION
                ========================== -->

                <div class="form-group">

                    <label for="occupation">
                        What is your occupation?
                    </label>

                    <select
                        id="occupation"
                        name="occupation"
                        required
                    >

                        <option value="">
                            Choose Option
                        </option>

                        <option value="Self Employed">
                            Self Employed
                        </option>

                        <option value="Employed">
                            Employed
                        </option>

                        <option value="Business">
                            Business
                        </option>

                    </select>

                </div>


                <!-- =========================
                     SALARY
                ========================== -->

                <div class="form-group">

                    <label for="salary">
                        Is your annual salary ₹3,00,000 or more?
                    </label>

                    <select
                        id="salary"
                        name="salary"
                        required
                    >

                        <option value="">
                            Choose Option
                        </option>

                        <option value="₹3,00,000 or more">
                            ₹3,00,000 or more
                        </option>

                        <option value="Less than ₹3,00,000">
                            Less than ₹3,00,000
                        </option>

                    </select>

                </div>


                <!-- =========================
                     LOAN TYPE
                ========================== -->

                <div class="form-group">

                    <label for="loanType">
                        Type of loan required
                    </label>

                    <select
                        id="loanType"
                        name="loan_type"
                        required
                    >

                        <option value="">
                            Choose Option
                        </option>

                        <option value="Personal Loan">
                            Personal Loan
                        </option>

                        <option value="Business Loan">
                            Business Loan
                        </option>

                        <option value="Home Loan">
                            Home Loan
                        </option>

                        <option value="Loan Against Property">
                            Loan Against Property
                        </option>

                        <option value="Credit Card">
                            Credit Card
                        </option>

                    </select>

                </div>


                <!-- =========================
                     CREDIT SCORE
                ========================== -->

                <div class="form-group">

                    <label for="creditScore">
                        What is your credit score?
                    </label>

                    <input
                        type="number"
                        id="creditScore"
                        name="credit_score"
                        placeholder="Enter your credit score"
                        min="300"
                        max="900"
                    >

                </div>


                <!-- =========================
                     CONTACT NUMBER
                ========================== -->

                <div class="form-group">

                    <label for="phone">
                        Contact number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="contact_number"
                        placeholder="Enter 10 digit mobile number"
                        inputmode="numeric"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- =========================
                     SUBMIT BUTTON
                ========================== -->

                <button
                    type="submit"
                    class="submit-button"
                >
                    Apply for Loan
                </button>

            </form>

        </div>

    </main>

</body>

</html>
